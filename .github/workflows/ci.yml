name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: cli-node
      # the TUI tests assume a box with the agent CLIs installed
      - name: Shim codex/claude/muse on PATH
        run: |
          mkdir -p /tmp/cibin
          for r in codex claude muse; do printf '#!/bin/sh\nexit 0\n' > /tmp/cibin/$r; chmod +x /tmp/cibin/$r; done
          echo /tmp/cibin >> "$GITHUB_PATH"
      - run: bun test tests/
        working-directory: cli-node
      - run: bun run build
        working-directory: cli-node
